
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening PubGo...</title>
</head>
<body>
  <p>Opening app...</p>

  <script>
    const params = window.location.search;

    window.location = "pubgo://" + params;

    setTimeout(() => {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isIOS = /iphone|ipad/i.test(navigator.userAgent);

      if (isAndroid) {
        window.location = "https://play.google.com/store/apps/details?id=pubandgo.de";
      } else if (isIOS) {
        window.location = "https://apps.apple.com/app/id6759283880";
      }
    }, 2000);
  </script>
</body>
</html>
